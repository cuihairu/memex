# XcodeGen 描述（iOS App 壳）：`xcodegen generate` 产出 Memex.xcodeproj。
# 核心逻辑在 SwiftPM 包 MemexKit（Sources/MemexKit）；App target 仅收集
# Sources/MemexApp 的 SwiftUI 面。CI 在 macOS runner 上验证编译。
name: Memex

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MemexKit:
    path: .

targets:
  Memex:
    type: application
    platform: iOS
    sources:
      - path: Sources/MemexApp
    info:
      path: Sources/MemexApp/Info.plist
      properties:
        CFBundleDisplayName: Memex
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        # 自定服务器端口（http 明文内网部署），R17 初始化向导场景
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: MemexKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memex.im
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

schemes:
  Memex:
    build:
      targets:
        Memex: all
    run:
      config: Debug