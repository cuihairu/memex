name: ios

on:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'common/proto/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'common/proto/**'
      - '.github/workflows/ios.yml'

jobs:
  ios:
    # Swift 6.1+ 工具链：brew 的 protoc-gen-swift 生成的代码含 nonisolated
    # 存储属性（SE-0449，Xcode 16.3+ 才支持），旧镜像默认工具链过旧/容量紧张
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf toolchain and xcodegen
        run: brew install protobuf swift-protobuf xcodegen

      - name: Generate protocol Swift sources from proto single source of truth
        run: |
          mkdir -p apps/ios/Sources/MemexKit/Proto
          protoc --swift_opt=Visibility=Public \
            --swift_out=apps/ios/Sources/MemexKit/Proto common/proto/memex.proto

      - name: Swift package tests (core)
        run: swift test --package-path apps/ios

      - name: Build iOS app for simulator
        run: |
          cd apps/ios
          xcodegen generate
          xcodebuild -project Memex.xcodeproj -scheme Memex \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build