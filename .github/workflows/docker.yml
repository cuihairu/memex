# 服务端与管理后台镜像出仓：推 tag（v*）或推 main 即构建并推 ghcr.io。
# main 推送产出不可变 sha-<完整 sha>（CI 部署链的回滚币）与 latest；v*
# 另出 semver。两镜像并行出：memex-server（服务端）、memex-admin（网页
# 管理后台，admin.memex.cuihairu.site → 192.168.5.5:8089 的交付面）。
# 构建全程在容器内（docker build 多阶段，server|admin/Dockerfile）——与
# 宿主/CI 的 vcpkg 树互不干扰；依赖层（vcpkg 静态编译 aws-sdk/drogon 等）
# 走 buildx gha 缓存，vcpkg.json 不变则跨 run 秒级复用（两 job 共用缓存
# 前缀分列镜像名，互不踩）。
name: docker

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - "*.svg"
      - ".editorconfig"
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write # 推 ghcr.io

jobs:
  build-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: memex-server
            dockerfile: server/Dockerfile
          - image: memex-admin
            dockerfile: admin/Dockerfile
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      # vcpkg 源经 named context 注入（Dockerfile 不走构建期克隆）；基线钉在
      # Dockerfile 的 VCPKG_COMMIT（与 vcpkg.json builtin-baseline 同值），
      # 从此处 grep 出来免得两处各写一份。必须完整 clone（非浅 fetch）：
      # baseline 解析要 read-tree 各 port 的历史树对象，单 commit 对象库
      # 不够（37268213624 红因）。CI 侧干净检出无 downloads 缓存、无
      # bootstrap 二进制 → 容器内走 bootstrap + 源码包下载（GHA 网络原生可达）。
      - name: 取 vcpkg 快照（named context）
        run: |
          VCPKG_COMMIT="$(grep -oP '(?<=^ARG VCPKG_COMMIT=)[0-9a-f]+' server/Dockerfile)"
          git clone --quiet https://github.com/microsoft/vcpkg vcpkg-src
          git -C vcpkg-src checkout --quiet "$VCPKG_COMMIT"

      - name: 登录 ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: buildx（gha 缓存）
        uses: docker/setup-buildx-action@v4

      - name: 元数据（sha 不可变 + semver + latest）
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            vcpkgsrc=./vcpkg-src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
