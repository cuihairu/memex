# Codecov 配置 —— 公共仓库 tokenless 上传，覆盖率口径由本文件驱动。
# 覆盖率定位为趋势信号（informational）：只报告，不因全局数字波动阻断合入；
# 提交前的硬门禁仍是本地 cmake --build 与 ctest 全绿（见 .github/workflows/ci.yml）。

codecov:
  require_ci_to_pass: true

coverage:
  status:
    # 项目级：相对基线自动比较（首次上传无基线即通过）
    project:
      default:
        target: auto
        informational: true
    # 行级：新增/变更代码的覆盖率
    patch:
      default:
        target: auto
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  # 第三方组件（vcpkg 安装树与清单）与构建产物
  - "third_party/**"
  - "vcpkg_installed*/**"
  - "docs/**"
  - "build/**"
  - "build-*/**"
  # 测试代码本身不进覆盖率分母
  - "**/tests/**"
