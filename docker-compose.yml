# memex 服务端一键起：memex-server（SQLite 持久卷）+ RustFS（S3 兼容对象
# 存储，文件面后端）+ memex-admin（网页管理后台）。用法：
# `docker compose up -d`，三服务 healthy 即就绪；客户端连 <宿主机>:8088
# （协作面对外口，与 Cloudflare tunnel 回源 tcp://192.168.5.5:8088 对齐）
# 或 <宿主机>:24360（局域网默认端口兼容），文件面 <宿主机>:24561；
# 浏览器开 <宿主机>:8089（管理后台，admin.memex.cuihairu.site →
# http://192.168.5.5:8089 即指这里）。
# 口令面：生产部署把 MEMEX_S3_ACCESS_KEY/SECRET_KEY 写进同目录 .env 再起
# （示例口令仅限本机试跑）；RustFS 数据与 SQLite 都在命名卷里，up/down 不丢。
# RustFS 容器契约（1.0.1 实测，与 server storage compose 生成器同口径）：
# RUSTFS_ADDRESS 必须「:端口」格式；healthcheck 只能 `rustfs info`；
# S3 API 9000 / 控制台 9001。
# 镜像构建（--build / 本地无镜像时 up 自动构建）需注入 vcpkg 源快照：
#   VCPKG_SRC=<vcpkg 检出> docker compose up --build
# 检出须含 vcpkg.json builtin-baseline 那个 commit；建议干净 clone（见 README
# 部署节），默认取 ./vcpkg-src。已建好镜像后直接 up 不触发构建、无需该路径。
# CI 部署链：TAG 指向 ghcr 上的不可变镜像 tag（sha-<完整 sha> 为回滚币，
# latest 兜底）；宿主 .env 记当前部署 TAG（deploy workflow 自动改写，回滚
# 同批换回），缺省 local＝本地自建镜像。
services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: memex-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${MEMEX_S3_ACCESS_KEY:-memexdemo}"
      RUSTFS_SECRET_KEY: "${MEMEX_S3_SECRET_KEY:-memexdemo-secret}"
      RUSTFS_ADDRESS: ":9000"
    command: ["server", "/data"]
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "rustfs", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      additional_contexts:
        vcpkgsrc: "${VCPKG_SRC:-./vcpkg-src}"
      args:
        # apt 镜像源（出境受限时设 UBUNTU_MIRROR=mirrors.aliyun.com 等）
        UBUNTU_MIRROR: "${UBUNTU_MIRROR:-}"
    image: ghcr.io/cuihairu/memex-server:${TAG:-local}
    container_name: memex-server
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      # S3 配置走环境变量（服务端旗标优先，此处无旗标即全 env 生效）；
      # path-style 由服务端内置（内网 http 默认）
      MEMEX_S3_ENDPOINT: "http://rustfs:9000"
      MEMEX_S3_BUCKET: "memex"
      MEMEX_S3_ACCESS_KEY: "${MEMEX_S3_ACCESS_KEY:-memexdemo}"
      MEMEX_S3_SECRET_KEY: "${MEMEX_S3_SECRET_KEY:-memexdemo-secret}"
    volumes:
      - server-data:/var/lib/memex
    command:
      ["serve", "--db", "/var/lib/memex/memex.db", "--port", "24360",
       "--webhook-port", "24361", "--files-port", "24561"]
    ports:
      - "8088:24360"  # 协作面对外口（tunnel 回源 tcp://192.168.5.5:8088）
      - "24360:24360" # 协作面局域网默认端口（客户端缺省 24360 直连兼容）
      - "24361:24361" # webhook 接入（HTTP：POST /hook/<token>）
      - "24561:24561" # 文件面（HTTP：/files/*）
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://127.0.0.1:24561/files/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 网页管理后台（独立进程直连同一 SQLite：账号组织/策略下发/留存/
  # 归档检索导出/设备台账/健康）。8089 映射宿主＝域名接入面。
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      additional_contexts:
        vcpkgsrc: "${VCPKG_SRC:-./vcpkg-src}"
      args:
        UBUNTU_MIRROR: "${UBUNTU_MIRROR:-}"
    image: ghcr.io/cuihairu/memex-admin:${TAG:-local}
    container_name: memex-admin
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # 文件面探活（健康页显示 up/down；不配则健康页显「未配置」）
      MEMEX_FILES_URL: "http://server:24561"
      # 对象存储探活（文件与配额页存储状态只读显示 up/down；探活无凭据）
      MEMEX_STORAGE_URL: "http://rustfs:9000"
    volumes:
      - server-data:/var/lib/memex
    ports:
      - "8089:8089" # 管理后台（HTTP）
    healthcheck:
      test:
        ["CMD-SHELL", "[ $$(curl -s -o /dev/null -w '%{http_code}' -m 4 http://127.0.0.1:8089/api/whoami) = 401 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  server-data:
  rustfs-data:
