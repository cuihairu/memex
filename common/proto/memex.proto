// Memex 协议单一事实源：帧格式 = 4 字节大端长度前缀 + Envelope 序列化字节。
// 类型编号沿用 v0.1 骨架分配（1–3 握手心跳、10–12 消息、20–22 文件、30–33 账号会话），
// 只增不改。UDP 发现宣告（T1.1）为独立 JSON 格式，不在本文件管辖。
syntax = "proto3";

package memex.protocol.v1;

// 消息类型。与 Envelope.type 对应；已分配编号不改动。
enum MsgType {
  MSG_TYPE_UNSPECIFIED = 0;
  HELLO = 1;         // 握手：终端标识与能力
  PING = 2;          // 心跳请求
  PONG = 3;          // 心跳应答
  TEXT = 10;         // 文本消息
  ACK = 11;          // 消息回执
  RECALL = 12;       // 撤回（仅显示层；服务端保留原文并记录撤回事件）
  FILE_META = 20;    // 文件元数据（文件字节流旁路，不经服务端）
  FILE_RESUME = 21;  // 文件续传偏移协商（接收方 → 发送方）
  FILE_DONE = 22;    // 文件终态：落盘完成与否 + 整文件 SHA-256 校验结果
  LOGIN = 30;        // 终端 → 服务端：账号登录（凭据、设备指纹与设备信息）
  LOGIN_RESULT = 31; // 服务端 → 终端：登录结果（成功／失败原因）
  KICK = 32;         // 服务端 → 终端：单点在线互踢，收到即下线并提示
  LOGOUT = 33;       // 终端 → 服务端：主动登出（随后由终端断开连接）
  ORG_QUERY = 34;    // 终端 → 服务端：请求组织架构（部门树＋成员资料，T3.1）
  ORG_DATA = 35;     // 服务端 → 终端：组织架构数据（登录后可查）
  GROUP_CMD = 36;    // 终端 → 服务端：群管理命令（建群/拉人/退群/公告，T4.1）
  GROUP_RESULT = 37; // 服务端 → 终端：群命令回执
  GROUP_QUERY = 38;  // 终端 → 服务端：查询我加入的群
  GROUP_DATA = 39;   // 服务端 → 终端：群列表（含成员与公告）
  CROSS_LOG = 40;    // 终端 → 服务端：跨态会话日志上报（时间/双方/时长，T4.2）
  READ = 41;         // 接收方 → 服务端：已读上报（msg_id，T4.3）
  READ_NOTICE = 42;  // 服务端 → 发送方：某条消息已被接收方已读（T4.3）
  PRESENCE_QUERY = 43; // 终端 → 服务端：请求在线账号表（T4.3）
  PRESENCE_DATA = 44;  // 服务端 → 终端：在线账号表（查询回执＋登录/登出/互踢推送，T4.3）
  FAV_QUERY = 45;    // 终端 → 服务端：请求常用联系人（T4.5）
  FAV_DATA = 46;     // 服务端 → 终端：常用联系人全量（T4.5）
  FAV_CMD = 47;      // 终端 → 服务端：常用联系人星标／最近上报（T4.5）
  NOTICE = 48;       // 通知消息（webhook 推送：标题／内容／紧急程度／可选跳转，T4.10）
  FILE_AUTHZ = 49;         // 终端 → 服务端：直连文件旁路授权四问（平台-10）
  FILE_AUTHZ_RESULT = 50;  // 服务端 → 终端：授权裁决（允许/拒绝＋依据＋可转发）
  PROFILE_CMD = 51;    // 终端 → 服务端：个人资料设置（个性签名，需求批⑪）
  PROFILE_RESULT = 52; // 服务端 → 终端：资料命令回执
  NUDGE = 53;          // 振屏消息（需求批⑥：窗口抖动提醒——实时信号，
                       // 服务端归档留痕但不进离线补投）
  DELIVER_NOTICE = 54; // 服务端 → 发送方：某条消息已送达接收方客户端
                       //（需求批⑦ 送达级回执，与 READ_NOTICE 同构）
  RECEIPT_QUERY = 55;  // 终端 → 服务端：批量查询自己发出消息的回执态
                       //（需求批⑦ 归档扩：离线期错过的通知重查面）
  RECEIPT_DATA = 56;   // 服务端 → 终端：回执态回包（逐条送达/已读名单）
  MESSAGE_QUERY = 57;  // 终端 → 服务端：会话历史按日期范围查询
                       //（需求批⑧：日期跳转/范围筛选的服务端补拉面）
  MESSAGE_PAGE = 58;   // 服务端 → 终端：日期范围查询回包（正序，落本地索引）
}

message Hello {
  string device_id = 1;     // 终端标识
  string device_name = 2;   // 展示名
  uint32 proto_version = 3; // 直连协议版本（2＝平台-8 直连安全握手 v1：身份+X25519+AEAD）
  bytes identity_pub = 4;   // 设备身份 Ed25519 公钥（32B，TOFU 定针校验——发现宣告不担认证）
  bytes eph_pub = 5;        // 握手 X25519 临时公钥（32B，仅本次握手有效，用即弃）
  bytes nonce = 6;          // 握手随机盐（16B，进签名文本与密钥派生）
  bytes sig = 7;            // Ed25519 签名（64B，签握手文本哈希——长期身份私钥持证证明）
}

message Text {
  string text = 1; // UTF-8 文本
}

// 回执：确认 msg_id 对应消息已被接收方收取（离线补投清理依据）
message Ack {
  string msg_id = 1;
}

message Recall {
  string target_seq = 1; // 被撤回消息的发送序号（十进制字符串）
  string msg_id = 2;     // 被撤回消息的服务端标识（协作态首选定位键）
}

message FileMeta {
  string transfer_id = 1; // 传输标识（UUID）
  string rel_path = 2;    // 目录传输时的相对路径（单文件为文件名）
  string name = 3;        // 文件名
  uint64 size = 4;        // 总字节数
  string sha256 = 5;      // 整文件 SHA-256（hex）
}

message FileResume {
  string transfer_id = 1; // 传输标识
  uint64 offset = 2;      // 接收方已落盘字节数（续传起点）
}

message FileDone {
  bool ok = 1;       // 落盘与校验结果
  string sha256 = 2; // 校验通过的哈希（ok 时有效）
  string error = 3;  // 失败原因（ok=false 时有效）
}

// 直连文件旁路授权查询（平台-10，蓝图§十九四问）：发送方持有效会话即第一问；
// 收方存在、部门边界、再转发由服务端统一 AuthorizationService 裁决——
// 文件不经服务器，判权必须经服务器。seq＝请求关联号，结果原样回带。
message FileAuthz {
  string to = 1;      // 接收方账号（直连发现宣告或选人而来）
  uint64 size = 2;    // 文件字节数（目录作业＝合计）
  string name = 3;    // 文件名（目录作业＝目录名；审计留痕）
  string sha256 = 4;  // 内容指纹（可空——大文件避免预计算双读）
  bool forward = 5;   // true＝本次为收到文件的再转发（策略可单独禁止）
}

message FileAuthzResult {
  bool allowed = 1;     // 裁决
  string reason = 2;    // 命中规则名（"allow:org-transfer"/"deny:cross-department"…）
  bool forwardable = 3; // 发送方生效策略的再转发开关（第四问答复随单携带）
}

message Login {
  string account = 1;           // 账号
  string password = 2;          // 凭据（摘要由通道约定，T2.1 定）
  string device_fingerprint = 3; // 设备指纹（SHA-256 hex）
  string device_kind = 4;       // 设备类型（desktop 等；主辅分级 T2.1 定）
  string device_name = 5;       // 设备名（主机名）
  string client_version = 6;    // 客户端版本
}

message LoginResult {
  bool ok = 1;         // 登录结果
  string reason = 2;   // 失败原因（失败时有效）
  string display_name = 3; // 展示名（成功时有效）
}

message Kick {
  string reason = 1;       // 踢出原因（单点在线）
  string replaced_by = 2;  // 顶替登录的设备名（供提示）
}

message Logout {}

// 组织架构（T3.1）：部门树（全路径表达）＋成员资料（直属上级、部门、职务、角色）。
message OrgDepartment {
  string path = 1; // 部门全路径（"公司/研发部/客户端组"）
}

message OrgMember {
  string account = 1;         // 账号
  string display_name = 2;    // 展示名
  string title = 3;           // 职务
  string department_path = 4; // 部门全路径（空=未分配）
  string manager = 5;         // 直属上级账号（空=无；每人至多一名）
  string role = 6;            // 角色（admin／member）
  string signature = 7;       // 个性签名（需求批⑪；空=未设，上限 120 字）
  // 在线时长（需求批⑩）：滚动 24h/7d/30d 窗内的在线秒数（查询时现算）。
  // 语义=「任一端在线即在线」：多端并行区间取并集，不叠加；
  // 服务端重启会把崩溃期悬空的在线段截断到重启点。
  int64 online_day_s = 8;     // 滚动 24 小时窗
  int64 online_week_s = 9;    // 滚动 7×24 小时窗
  int64 online_month_s = 10;  // 滚动 30×24 小时窗
}

// 策略开关（T3.4）：按部门配置、全局兜底（department_path 空=全局默认）。
message OrgPolicy {
  string department_path = 1; // 空串=全局默认行
  bool allow_anonymous = 2;       // 允许免登录（直连态）使用
  bool allow_cross_state = 3;     // 允许已登录端与未登录设备通信
  bool new_device_approval = 4;   // 新设备登录需审批
  bool allow_cross_dept_file = 5; // 允许直连文件跨部门（平台-10，默认禁）
  bool allow_forward_file = 6;    // 允许直连文件再转发（平台-10，默认允）
}

// 群组（权限模型「群在组织架构可见」/etc/group 类比）：全量群透明可查。
message OrgGroup {
  uint64 group_id = 1;        // 群号
  string name = 2;            // 群名
  string owner = 3;           // 群主账号
  repeated string members = 4; // 成员账号（含群主）
}

message OrgData {
  repeated OrgDepartment departments = 1;
  repeated OrgMember members = 2;
  repeated OrgPolicy policies = 3; // 策略开关（T3.4，随组织架构一并下发）
  repeated OrgGroup groups = 4;    // 群组清单（权限模型：组织架构可见）
}

// —— 群聊（T4.1）——
// 群管理命令（op 取值："create" 建群｜"invite" 拉人｜"leave" 退群｜"announce" 群公告
// ｜"announce_history" 公告编辑历史查询——回执 history 倒序带全，R24-1）。
// 群消息走既有 TEXT：to = "group:<群号>"，服务端按成员扇出并全量归档。
message GroupCmd {
  string op = 1;              // create／invite／leave／announce／announce_history
  string name = 2;            // 群名（create）
  repeated string members = 3; // 成员账号（create／invite；create 时建群者自动入群）
  uint64 group_id = 4;        // 群号（invite／leave／announce／announce_history）
  string announcement = 5;    // 公告内容（announce）
}

message AnnouncementRev {
  string editor = 1;   // 设置人账号
  string content = 2;  // 该次设置后的全文（空串=该次为清除）
  int64 ts_ms = 3;     // 设置时刻（服务端时钟）
}

message GroupResult {
  bool ok = 1;
  string reason = 2;   // 失败原因（群不存在／非成员／账号不存在…）
  string op = 3;       // 回执对应的命令
  uint64 group_id = 4; // 成功建群时回填群号
  // R24-1：op=announce_history 时的编辑历史（倒序；其余 op 不填——
  // 未知该字段的旧客户端按 proto3 未知字段跳过，不受影响）
  repeated AnnouncementRev history = 5;
}

message GroupInfo {
  uint64 group_id = 1;
  string name = 2;
  string owner = 3;          // 群主（建群者）
  string announcement = 4;   // 群公告（空=未设）
  repeated string members = 5; // 成员账号（含群主）
}

message GroupData {
  repeated GroupInfo groups = 1; // 我加入的全部群
}

// —— 跨态会话日志（T4.2）——
// 由「已登录端」上报与未登录设备的跨态会话：建立（start）与结束（end）。
// 只记时间、双方与时长——不含任何消息内容（留痕纪律）。
message CrossLog {
  string op = 1;          // start（建立）／end（结束）
  string peer_device = 2; // 对端设备标识
  string peer_name = 3;   // 对端设备名（显示用）
  int64 started_ms = 4;   // 会话建立时刻
  int64 ended_ms = 5;     // 会话结束时刻（end 时有效；时长 = 结束 − 建立）
}

// —— 已读回执与在线状态（T4.3）——
// 已读上报由消息接收方发出（仅协作态单聊／群聊归档消息；直连态无服务端不涉及）。
// 服务端记 message_reads 後，若原发送方在线即推送 READ_NOTICE。
message Read {
  string msg_id = 1; // 服务端分配的消息标识（归档去重键）
}

message ReadNotice {
  string msg_id = 1; // 被已读的消息
  string reader = 2; // 已读方账号
  int64 read_ms = 3; // 已读时刻（服务端受理时刻）
}

// —— 需求批⑦ 消息回执（送达+已读两级）——

// 送达级回执（服务端 → 发送方）：接收方客户端已 ACK 收取。与
// READ_NOTICE 同构；接收方不在线改由离线补投触发，同样走这里。
message DeliverNotice {
  string msg_id = 1;       // 被送达的消息
  string delivered_to = 2; // 送达方账号（群消息＝逐成员各一条）
  int64 delivered_ms = 3;  // 送达时刻（服务端受理 ACK 时刻）
}

// 回执态查询（发送方视角）：批量查自己发出消息的送达/已读名单。仅
// message_from == 查询者的条目回包（他人消息的回执不泄露）。
message ReceiptQuery {
  repeated string msg_ids = 1; // 自己发出消息的服务端标识（上限 100）
}
message ReceiptEntry {
  string msg_id = 1;            // 查询的消息
  repeated string delivered_to = 2; // 已送达账号名单（事件台账现算）
  repeated string readers = 3;  // 已读账号名单（readers_for 同源）
}
message ReceiptData {
  repeated ReceiptEntry entries = 1; // 非本人消息不出现在回包里
}

// —— 会话历史按日期查询（需求批⑧）——
// 请求：peer=对端账号（单聊）或群键 group:N；时间窗毫秒含端点（0=不限）；
// limit 由服务端封顶（缺省 200，至多 500）。
message MessageQuery {
  string peer = 1;
  int64 from_ms = 2;
  int64 until_ms = 3;
  int32 limit = 4;
}
// 归档消息条目：text 即归档形态（通知为组合文本、振屏为 "[振屏]" 标记）；
// 已撤回的条目不出现在回包里（撤回即不可见，客户端本地已有撤回渲染）。
message ArchivedMsg {
  string msg_id = 1;
  string from = 2;
  string to = 3;
  int64 ts_ms = 4;
  string text = 5;
}
message MessagePage {
  string peer = 1;      // 回显查询目标（客户端按它路由会话）
  int64 from_ms = 2;
  int64 until_ms = 3;
  repeated ArchivedMsg messages = 4; // 时间正序（聊天渲染方向）
}

// 在线账号表：查询回执与变更推送共用。推送点=登录成功／登出／互踢／
// 意外断开（服务端在线表变化即广播，在线者都收到，含自己）。
message PresenceData {
  repeated string accounts = 1; // 当前在线账号（排序后）
}

// —— 常用联系人（T4.5）——
// 星标／最近按账号落服务端，换机即得；peer 为对端账号或 "group:N"。
// 排序口径：星标置顶（last_ms 新的在前）＞未星标按最近
message FavEntry {
  string peer = 1;   // 对端标识：协作账号或群键
  bool starred = 2;  // 星标（置顶）
  int64 last_ms = 3; // 最近一次联系时刻（双向消息受理即刷新）
}
message FavData {
  repeated FavEntry entries = 1; // 全量（按星标＋最近排序）
}
message FavCmd {
  string op = 1;       // star（星标）／unstar（取消）／touch（仅刷新最近）
  string peer = 2;
  int64 ts_ms = 3;     // touch 时的联系时刻（客户端取当前时刻）
}

// —— 个人资料（需求批⑪）——
message ProfileCmd {
  string op = 1;         // set_signature（本人设置个性签名；空串=清除）
  string signature = 2;  // 签名内容（≤120 字，超限服务端拒）
}
message ProfileResult {
  bool ok = 1;
  string reason = 2; // 失败原因（未登录／签名过长…）
  string op = 3;     // 回执对应的命令
}

// 振屏（需求批⑥）：空体——类型即信号（窗口抖动提醒无内容载荷）。
// 实时信号：在线即投；不进离线补投（补投的抖动失去时效且成骚扰），
// 归档留痕以 "[振屏]" 标记文本落库，历史检索可见。
message Nudge {}

// 通知（T4.10）：webhook 接入推送的站内通知——紧急程度三级驱动客户端分级
// 推送（普通＝站内会话消息、重要＝桌面通知强提醒、紧急＝置顶弹窗需确认收悉）。
message Notice {
  enum Urgency {
    URGENCY_UNSPECIFIED = 0; // 未指定＝按普通处理
    NORMAL = 1;              // 普通：仅站内会话消息
    IMPORTANT = 2;           // 重要：桌面通知强提醒
    URGENT = 3;              // 紧急：置顶弹窗需确认收悉
  }
  string title = 1;        // 标题（必填）
  string content = 2;      // 正文（必填）
  Urgency urgency = 3;     // 紧急程度（默认 NORMAL）
  string jump_url = 4;     // 可选跳转（空＝无）
}

// 信封：所有帧的载荷体。oneof 字段号 = 100 + 对应类型编号，便于读码对账。
message Envelope {
  MsgType type = 1;
  uint64 seq = 2;   // 发送序号（会话内单调）
  string from = 3;  // 发送方标识（直连态为设备标识，协作态为账号）
  string to = 4;    // 接收方标识
  int64 ts_ms = 5;  // 发送时间戳（毫秒）
  string msg_id = 6; // 消息标识（服务端分配：sha256(from:seq)）——去重与补投清理依据

  oneof body {
    Hello hello = 101;
    Text text = 110;
    Ack ack = 111;
    Recall recall = 112;
    FileMeta file_meta = 120;
    FileResume file_resume = 121;
    FileDone file_done = 122;
    Login login = 130;
    LoginResult login_result = 131;
    Kick kick = 132;
    Logout logout = 133;
    OrgData org_data = 135;
    GroupCmd group_cmd = 136;
    GroupResult group_result = 137;
    GroupData group_data = 139;
    CrossLog cross_log = 140;
    Read read = 141;
    ReadNotice read_notice = 142;
    PresenceData presence_data = 144;
    FavData fav_data = 146;
    FavCmd fav_cmd = 147;
    Notice notice = 148;
    FileAuthz file_authz = 149;
    FileAuthzResult file_authz_result = 150;
    ProfileCmd profile_cmd = 151;
    ProfileResult profile_result = 152;
    Nudge nudge = 153;
