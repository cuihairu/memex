<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Memex 原型 · 移动 · 聊天</title>
<link rel="stylesheet" href="prototypes.css">
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>10:25</span>
    <span class="sb-right">
      <svg width="15" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="20" height="11" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="20" height="10" rx="3" stroke-width="1.4"/><rect x="3" y="3" width="13" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
  </div>

  <div class="m-chat-head">
    <span class="back">‹</span>
    <div class="avatar v3 sm">李</div>
    <div style="min-width:0">
      <div class="m-ch-name">李明</div>
      <div class="m-ch-sub">财务部 · 在线 · 已归档</div>
    </div>
    <span style="margin-left:auto;display:flex;gap:10px;color:var(--text-2)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </span>
  </div>

  <div class="m-chat-scroll">
    <div class="day-divider">今天 10:12</div>

    <div class="msg">
      <div class="avatar v3 sm">李</div>
      <div class="msg-col">
        <div class="msg-meta"><span class="sender-name">李明</span><span>10:12</span></div>
        <div class="bubble">王工，对账单麻烦发我最新版，审计今天要。</div>
      </div>
    </div>

    <div class="msg mine">
      <div class="avatar sm">张</div>
      <div class="msg-col">
        <div class="msg-meta"><span class="read-receipt read">已读</span><span>10:13</span></div>
        <div class="bubble">好的，刚核完第三版，这就发你。</div>
      </div>
    </div>

    <div class="msg mine">
      <div class="avatar sm">张</div>
      <div class="msg-col">
        <div class="msg-meta"><span class="read-receipt read">已读</span><span>10:14</span></div>
        <div class="bubble file-card" style="min-width:210px">
          <span class="f-icon">表</span>
          <span>
            <div style="font-weight:700">对账单_202609_v3.xlsx</div>
            <div class="f-meta">2.4 MB · 已完成 · 元数据已入归档</div>
          </span>
        </div>
      </div>
    </div>

    <div class="msg">
      <div class="avatar v3 sm">李</div>
      <div class="msg-col">
        <div class="msg-meta"><span class="sender-name">李明</span><span>10:24</span></div>
        <div class="bubble"><span class="quote">引用 对账单_202609_v3.xlsx</span>收到。下午审计问起 8 月的合同扫描件，归档里能直接调吗？</div>
      </div>
    </div>

    <div class="msg mine">
      <div class="avatar sm">张</div>
      <div class="msg-col">
        <div class="msg-meta"><span>10:25</span></div>
        <div class="bubble">能。管理员按人＋关键词检索就行，撤过的也留原文。</div>
      </div>
    </div>
  </div>

  <div class="m-input">
    <div class="in-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      协作态 · 本会话消息将进入服务端归档
    </div>
    <div class="in-row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.3 1.8 3.5 1.8 3.5-1.8 3.5-1.8M9 9.5h.01M15 9.5h.01"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <div class="field">发送消息…</div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <div class="m-send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14m0 0-6-6m6 6-6 6"/></svg>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H7l-4 3v-4.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
      会话
    </button>
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.6c2.7.3 4.7 1.9 5.4 4.4"/></svg>
      通讯录
    </button>
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      文件
    </button>
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.9-3.4 3.7-5.2 7-5.2s6.1 1.8 7 5.2"/></svg>
      我
    </button>
  </div>
</div>
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.body.classList.add('dark');</script>
</body>
</html>
