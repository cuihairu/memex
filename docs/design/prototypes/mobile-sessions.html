<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Memex 原型 · 移动 · 会话</title>
<link rel="stylesheet" href="prototypes.css">
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>10:24</span>
    <span class="sb-right">
      <svg width="15" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="20" height="11" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="20" height="10" rx="3" stroke-width="1.4"/><rect x="3" y="3" width="13" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
  </div>

  <div class="appbar">
    <div>
      <div class="a-title">会话</div>
      <div class="a-sub">协作态 · memex.corp.local · 消息全量归档</div>
    </div>
    <div class="a-act">
      <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>

  <div class="phone-body">
    <div class="m-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      搜索消息 / 联系人 / 群聊
    </div>

    <div class="m-list">
      <div class="row active">
        <div class="avatar v3">李<i class="presence on"></i></div>
        <div class="r-main">
          <div class="r-top"><span class="r-name">李明</span><span class="r-time">10:24</span></div>
          <div class="r-sub">王工：合同扫描件已归档，可直接检索</div>
        </div>
      </div>
      <div class="row">
        <div class="avatar v2">产</div>
        <div class="r-main">
          <div class="r-top"><span class="r-name">产品研发部</span><span class="r-time">10:02</span></div>
          <div class="r-sub">周航：<span style="color:var(--brand-deep);font-weight:600">@张伟</span> 联调环境已就绪</div>
        </div>
        <div class="r-badges"><span class="n-count">12</span></div>
      </div>
      <div class="row">
        <div class="avatar v4">项</div>
        <div class="r-main">
          <div class="r-top"><span class="r-name">MES 二期项目群</span><span class="r-time">09:30</span></div>
          <div class="r-sub">[公告] 本周四 14:00 里程碑评审</div>
        </div>
        <div class="r-badges"><span class="n-count">5</span></div>
      </div>
      <div class="row">
        <div class="avatar v6">王<i class="presence on"></i></div>
        <div class="r-main">
          <div class="r-top"><span class="r-name">王芳</span><span class="r-time">09:41</span></div>
          <div class="r-sub">[文件] Q4 预算表_v4.xlsx</div>
        </div>
        <div class="r-badges"><span class="n-count">3</span></div>
      </div>
      <div class="row">
        <div class="avatar v5">刘<i class="presence dnd"></i></div>
        <div class="r-main">
          <div class="r-top"><span class="r-name">刘洋（总经理）</span><span class="r-time">09:12</span></div>
          <div class="r-sub">方案按第二版推进，细节找周航对</div>
        </div>
        <div class="r-badges"><span class="muted-badge">已读</span></div>
      </div>
      <div class="row" style="opacity:.75">
        <div class="avatar v7">赵<i class="presence off"></i></div>
        <div class="r-main">
          <div class="r-top"><span class="r-name">赵强</span><span class="r-time">昨天</span></div>
          <div class="r-sub">部署包已传共享空间，请查收</div>
        </div>
      </div>
      <div class="row" style="opacity:.75">
        <div class="avatar v8">陈<i class="presence off"></i></div>
        <div class="r-main">
          <div class="r-top"><span class="r-name">陈静</span><span class="r-time">昨天</span></div>
          <div class="r-sub">好的，明天见</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H7l-4 3v-4.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
      会话
    </button>
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.6c2.7.3 4.7 1.9 5.4 4.4"/></svg>
      通讯录
    </button>
    <button class="tab">
      <span class="n-count" style="position:absolute">2</span>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      文件
    </button>
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.9-3.4 3.7-5.2 7-5.2s6.1 1.8 7 5.2"/></svg>
      我
    </button>
  </div>
</div>
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.body.classList.add('dark');</script>
</body>
</html>
