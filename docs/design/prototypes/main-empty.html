<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Memex 原型 · 桌面 · 联系人空态</title><link rel="stylesheet" href="prototypes.css"><style>.window{width:min(1120px,96vw);height:min(720px,92vh)}.sidebar{width:272px}.main.main-empty{position:relative}.first-guide{width:470px;text-align:center;padding:10px 24px}.guide-mark{width:68px;height:68px;border-radius:20px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;margin:0 auto 18px;font-size:29px}.first-guide h1{font-size:20px;margin-bottom:8px}.first-guide p{color:var(--text-2);font-size:13px;line-height:1.8}.guide-actions{display:flex;justify-content:center;gap:9px;margin:20px 0 26px}.guide-actions .btn{flex:none;padding:8px 16px}.guide-links{display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left}.guide-link{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.guide-link b{display:block;font-size:12px}.guide-link small{color:var(--text-2);font-size:11px}.empty-list{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--text-3);font-size:12px;line-height:1.8}.top-actions{margin-left:auto;display:flex;gap:6px}.side-nav{display:flex;gap:4px;padding:0 12px 10px}.side-nav span{font-size:11px;color:var(--text-2);padding:5px 8px;border-radius:6px}.side-nav .on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}</style></head><body><div class="window"><div class="titlebar"><img class="logo" src="../../src/public/logo.svg"><span class="app-name">Memex</span><span class="divider-v"></span><span class="state-badge ok"><i class="dot"></i>已登录</span><div class="win-controls"><span class="c-min"></span><span class="c-max"></span><span class="c-close"></span></div></div><div class="app-body"><nav class="rail"><button class="rail-item active">◌<span class="tip">会话</span></button><button class="rail-item">♧<span class="tip">通讯录</span></button><button class="rail-item">☆<span class="tip">收藏</span></button><button class="rail-item">▱<span class="tip">文件</span></button><span class="spacer"></span><button class="rail-item">⚙<span class="tip">设置</span></button><div class="avatar v5" style="width:34px;height:34px;border-radius:10px">林</div></nav><aside class="sidebar"><div class="side-head"><div class="side-title">会话</div><div class="search">⌕ <input placeholder="搜索联系人或消息"></div></div><div class="side-nav"><span class="on">全部</span><span>未读</span><span>群聊</span></div><div class="empty-list">还没有会话<br>从通讯录选择联系人，开始聊天</div></aside><main class="main main-empty"><div class="first-guide"><div class="guide-mark">✦</div><h1>欢迎使用 Memex</h1><p>你的会话会显示在这里。先从通讯录找到同事，或打开文件传输，开始使用 Memex。</p><div class="guide-actions"><button class="btn primary">打开通讯录</button><button class="btn ghost-brand">查找局域网设备</button></div><div class="guide-links"><div class="guide-link"><b>通讯录</b><small>查找组织成员与联系人</small></div><div class="guide-link"><b>收藏</b><small>保存常用消息与内容</small></div><div class="guide-link"><b>文件</b><small>查看文件收发与传输记录</small></div><div class="guide-link"><b>设置</b><small>调整主题、通知与快捷键</small></div></div></div></main></div></div><script>if(new URLSearchParams(location.search).get('theme')==='dark')document.body.classList.add('dark');</script></body></html>
