<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>Memex 原型 · 设置 · 账号</title><link rel="stylesheet" href="prototypes.css"><style>
.window{width:min(1120px,96vw);height:min(720px,92vh);border-radius:12px}.settings-layout{flex:1;display:flex;min-height:0}.settings-nav{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px}.settings-nav .side-group{padding:4px 10px 12px}.settings-content{flex:1;overflow:auto;background:var(--bg);padding:24px 34px}.page-title{font-size:20px;font-weight:700}.page-sub{color:var(--text-2);margin:4px 0 22px;font-size:12px}.group{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}.group h3{padding:12px 16px;font-size:13px;background:var(--panel-2);border-bottom:1px solid var(--line)}.setting-row{min-height:60px;display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line)}.setting-row:last-child{border:0}.setting-copy{flex:1;min-width:0}.setting-copy b{display:block;font-size:13px}.setting-copy small{display:block;color:var(--text-2);font-size:11.5px;margin-top:2px}.control{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12px}.select,.field,.mini-btn{border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);padding:6px 10px;color:var(--text-1);min-width:112px}.mini-btn{min-width:0;color:var(--brand-deep)}.toggle{width:34px;height:19px;border-radius:99px;background:var(--brand);position:relative}.toggle:after{content:"";position:absolute;right:2px;top:2px;width:15px;height:15px;background:white;border-radius:50%}.toggle.off{background:var(--text-3)}.toggle.off:after{right:17px}.choice{display:flex;gap:5px}.choice span{padding:5px 9px;border:1px solid var(--line);border-radius:6px}.choice .on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}.footnote{color:var(--text-3);font-size:11px;margin-top:8px}.titlebar{height:42px}
</style></head><body><div class="window"><div class="titlebar"><img class="logo" src="../../src/public/logo.svg"><span class="app-name">Memex</span><span class="divider-v"></span><span style="font-size:12px;color:var(--text-2)">设置</span><div class="win-controls"><span class="c-min"></span><span class="c-max"></span><span class="c-close"></span></div></div><div class="app-body"><nav class="rail"><button class="rail-item active" title="会话">◌</button><button class="rail-item" title="通讯录">♧</button><button class="rail-item" title="收藏">☆</button><button class="rail-item" title="文件">▱</button><span class="spacer"></span><button class="rail-item" title="设置">⚙</button><div class="avatar v5" style="width:34px;height:34px;border-radius:10px">林</div></nav><div class="settings-layout"><aside class="settings-nav"><div class="side-group">设置</div><div class="tree-node "><span class="tw">›</span>通用</div><div class="tree-node active"><span class="tw">›</span>账号</div><div class="tree-node "><span class="tw">›</span>消息</div><div class="tree-node "><span class="tw">›</span>隐私</div><div class="tree-node "><span class="tw">›</span>高级</div></aside><main class="settings-content"><div class="page-title">账号</div><div class="page-sub">管理当前登录身份与本机登录状态。</div><section class="group"><h3>个人资料</h3><div class="setting-row"><div class="setting-copy"><b>头像</b><small>当前账号头像。</small></div><div class="control"><div class="avatar v5" style="width:42px;height:42px;border-radius:12px">林</div><button class="mini-btn">更换头像</button></div></div><div class="setting-row"><div class="setting-copy"><b>昵称</b><small>显示给联系人和群成员的名称。</small></div><div class="control"><span class="field">林晓</span><button class="mini-btn">编辑资料</button></div></div></section><section class="group"><h3>安全与设备</h3><div class="setting-row"><div class="setting-copy"><b>账号安全</b><small>账号密码由服务器账号体系管理。</small></div><div class="control"><button class="mini-btn">账号安全</button></div></div><div class="setting-row"><div class="setting-copy"><b>设备管理</b><small>查看已登录设备与会话。</small></div><div class="control"><button class="mini-btn">管理设备</button></div></div></section><section class="group"><h3>登录状态</h3><div class="setting-row"><div class="setting-copy"><b>退出登录</b><small>退出当前协作账号；本机直连功能仍可使用。</small></div><div class="control"><button class="mini-btn">退出登录</button></div></div></section><div class="footnote">原型说明：控件仅展示布局，不代表尚未实现的功能已可操作。</div></main></div></div></div><script>if(new URLSearchParams(location.search).get('theme')==='dark')document.body.classList.add('dark');</script></body></html>
