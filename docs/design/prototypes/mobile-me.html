<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Memex 原型 · 移动 · 我</title>
<link rel="stylesheet" href="prototypes.css">
<style>
  .me-card { margin: 6px 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 13px; }
  .me-card .m-name { font-size: 16.5px; font-weight: 800; }
  .me-card .m-sub { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .me-card .qr { margin-left: auto; width: 40px; height: 40px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--text-3); }
  .sec { margin: 0 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .sec-title { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .05em; padding: 12px 16px 4px; }
  .cell { display: flex; align-items: center; gap: 11px; padding: 12.5px 16px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .cell:first-of-type { border-top: none; }
  .cell .c-ic { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--brand-soft); color: var(--brand-deep); }
  .cell .c-ic.g { background: var(--ok-soft); color: var(--ok); }
  .cell .c-ic.n { background: var(--panel-2); color: var(--text-2); border: 1px solid var(--line); }
  .cell .c-val { margin-left: auto; color: var(--text-3); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .cell .c-val b { color: var(--text-2); font-weight: 600; }
  .cell.sub { padding-left: 57px; font-size: 12.5px; color: var(--text-2); }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>10:26</span>
    <span class="sb-right">
      <svg width="15" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="20" height="11" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="1" y="1" width="20" height="10" rx="3" stroke-width="1.4"/><rect x="3" y="3" width="13" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M23 4v4" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
  </div>

  <div class="appbar"><div class="a-title">我</div></div>

  <div class="phone-body" style="overflow-y:auto;padding-bottom:10px">
    <div class="me-card">
      <div class="avatar lg" style="width:56px;height:56px;font-size:22px;border-radius:16px">张</div>
      <div>
        <div class="m-name">张伟</div>
        <div class="m-sub">产品研发部 · 研发一组 · 工号 2077</div>
        <div style="margin-top:5px"><span class="state-badge collab"><i class="dot"></i>协作态 · memex.corp.local</span></div>
      </div>
      <div class="qr">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14h1M14 20h1M18 18h3v3h-3z"/></svg>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">账号与设备</div>
      <div class="cell">
        <span class="c-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg></span>
        登录设备管理
        <span class="c-val"><b>本机 + 桌面端 1 台</b> ›</span>
      </div>
      <div class="cell sub">
        桌面端同一账号仅一台在线：另一台电脑登录时，本机将被下线并收到提示
      </div>
      <div class="cell">
        <span class="c-ic g"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
        登录记录
        <span class="c-val"><b>最近 4 次</b> ›</span>
      </div>
      <div class="cell">
        <span class="c-ic n"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        消息留存策略（管理侧下发）
        <span class="c-val"><b>6 个月</b> ›</span>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">通用</div>
      <div class="cell">
        <span class="c-ic n"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        本地缓存清理
        <span class="c-val"><b>仅清理本机 · 不影响服务端归档</b> ›</span>
      </div>
      <div class="cell">
        <span class="c-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 5V3m0 18v-2m7-7h2M3 12h2m10.7-5.7 1.4-1.4M6.9 17.1l-1.4 1.4m0-11.4L4.1 5.5m13.2 11.4 1.4 1.4"/></svg></span>
        通知与提醒
        <span class="c-val">›</span>
      </div>
      <div class="cell">
        <span class="c-ic n"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg></span>
        关于 Memex
        <span class="c-val"><b>v1.0.0（1024）</b> ›</span>
      </div>
    </div>

    <div class="sec">
      <div class="cell">
        <span class="c-ic" style="background:var(--warn-soft);color:var(--warn)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h5v5M9 20H4v-5M20 15v5h-5M4 9V4h5"/></svg></span>
        切换服务器 / 退出登录
        <span class="c-val">›</span>
      </div>
    </div>

    <div style="margin:2px 16px;padding:10px 13px;border-radius:12px;background:var(--brand-softer);font-size:11px;color:var(--brand-deep);line-height:1.75">
      移动端全部功能基于登录账号运行（不提供免登录模式）。桌面端才具备未登录直连态——那是「本网段临时使用」的形态。
    </div>
  </div>

  <div class="tabbar">
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H7l-4 3v-4.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
      会话
    </button>
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.6c2.7.3 4.7 1.9 5.4 4.4"/></svg>
      通讯录
    </button>
    <button class="tab">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      文件
    </button>
    <button class="tab active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c.9-3.4 3.7-5.2 7-5.2s6.1 1.8 7 5.2"/></svg>
      我
    </button>
  </div>
</div>
<script>if (new URLSearchParams(location.search).get('theme') === 'dark') document.body.classList.add('dark');</script>
</body>
</html>
